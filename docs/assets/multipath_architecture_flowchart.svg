<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="wifiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="cellGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" rx="16" fill="url(#bgGrad2)"/>
  <rect x="1" y="1" width="1198" height="698" rx="15" fill="none" stroke="#1F2937" stroke-width="2"/>

  <!-- Title -->
  <text x="50" y="50" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Arsitektur Alur Sistem AetherPulse: Duplikasi Paket Jalur Ganda</text>
  <text x="50" y="75" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="14">Diagram alur end-to-end dari Samsung A53, transmisi radio terpisah, hingga penyaringan O(1) di Helsinki</text>

  <!-- Zone 1: Android Client (Samsung A53) -->
  <rect x="40" y="110" width="300" height="540" rx="12" fill="#131D31" stroke="#1E293B" stroke-width="2"/>
  <rect x="40" y="110" width="300" height="40" rx="12" fill="#1E293B"/>
  <text x="60" y="136" fill="#E2E8F0" font-family="sans-serif" font-size="14" font-weight="700">Klien Ponsel: Samsung A53</text>

  <!-- Box 1.1: Mobile Legends -->
  <rect x="60" y="170" width="260" height="60" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="190" y="196" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Aplikasi Mobile Legends</text>
  <text x="190" y="215" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Paket UDP Port 5000 - 30200</text>

  <!-- Arrow -->
  <line x1="190" y1="230" x2="190" y2="260" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 1.2: VpnService TUN -->
  <rect x="60" y="260" width="260" height="70" rx="8" fill="#1E293B" stroke="#0284C7"/>
  <text x="190" y="286" fill="#38BDF8" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Android VpnService TUN</text>
  <text x="190" y="305" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Split Tunneling Eksklusif Game</text>
  <text x="190" y="320" fill="#64748B" font-family="sans-serif" font-size="10" text-anchor="middle">Aplikasi lain tetap pakai jalur normal</text>

  <!-- Arrow -->
  <line x1="190" y1="330" x2="190" y2="360" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 1.3: Packet Multiplexer & FEC -->
  <rect x="60" y="360" width="260" height="90" rx="8" fill="#1E293B" stroke="#8B5CF6"/>
  <text x="190" y="386" fill="#C084FC" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Mesin Duplikasi &amp; XOR FEC</text>
  <text x="190" y="405" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Tagging Sequence 32-bit</text>
  <text x="190" y="423" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">1 Paritas XOR per 4 Paket Game</text>
  <text x="190" y="440" fill="#A855F7" font-family="sans-serif" font-size="10" text-anchor="middle">Menggandakan Paket ke 2 Salinan</text>

  <!-- Split Connectors -->
  <line x1="130" y1="450" x2="130" y2="490" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <line x1="250" y1="450" x2="250" y2="490" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Radio 1: Wi-Fi -->
  <rect x="60" y="490" width="125" height="130" rx="8" fill="#0C4A6E" stroke="#0284C7"/>
  <text x="122" y="515" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Radio Wi-Fi</text>
  <text x="122" y="533" fill="#38BDF8" font-family="sans-serif" font-size="10" text-anchor="middle">Antarmuka wlan0</text>
  <text x="122" y="555" fill="#93C5FD" font-family="sans-serif" font-size="10" text-anchor="middle">Low Latency Lock</text>
  <text x="122" y="575" fill="#93C5FD" font-family="sans-serif" font-size="10" text-anchor="middle">DSCP 46 (AC_VO)</text>
  <text x="122" y="605" fill="#BAE6FD" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Salinan Paket A</text>

  <!-- Radio 2: Cellular -->
  <rect x="195" y="490" width="125" height="130" rx="8" fill="#78350F" stroke="#D97706"/>
  <text x="257" y="515" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Radio Seluler</text>
  <text x="257" y="533" fill="#FCD34D" font-family="sans-serif" font-size="10" text-anchor="middle">Antarmuka rmnet0</text>
  <text x="257" y="555" fill="#FDE68A" font-family="sans-serif" font-size="10" text-anchor="middle">Modem 4G / 5G LTE</text>
  <text x="257" y="575" fill="#FDE68A" font-family="sans-serif" font-size="10" text-anchor="middle">Bypass Router Rumah</text>
  <text x="257" y="605" fill="#FEF3C7" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Salinan Paket B</text>

  <!-- Zone 2: Transmission Paths -->
  <path d="M 122 620 C 122 660, 480 520, 520 380" fill="none" stroke="#0284C7" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="350" y="580" fill="#38BDF8" font-family="sans-serif" font-size="12">Jalur 1: Router Rumah &amp; Fiber Optik</text>

  <path d="M 257 620 C 257 670, 480 580, 520 440" fill="none" stroke="#D97706" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="350" y="625" fill="#FBBF24" font-family="sans-serif" font-size="12">Jalur 2: Menara Seluler BTS &amp; Backbone Operator</text>

  <!-- Zone 3: Edge Relay (Helsinki) -->
  <rect x="520" y="240" width="340" height="340" rx="12" fill="#131D31" stroke="#10B981" stroke-width="2"/>
  <rect x="520" y="240" width="340" height="40" rx="12" fill="#064E3B"/>
  <text x="690" y="266" fill="#A7F3D0" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">AetherPulse Edge Relay (Helsinki)</text>

  <!-- Box 3.1: Dual Port Receiver -->
  <rect x="545" y="300" width="290" height="60" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="690" y="325" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Penerima Multi-Path UDP (Port 8910)</text>
  <text x="690" y="345" fill="#94A3B8" font-family="sans-serif" font-size="11" text-anchor="middle">Socket Buffer 16MB Kernel BBR</text>

  <!-- Arrow -->
  <line x1="690" y1="360" x2="690" y2="390" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3.2: O(1) Sliding Window Deduplicator -->
  <rect x="545" y="390" width="290" height="90" rx="8" fill="#1E293B" stroke="#10B981"/>
  <text x="690" y="415" fill="#34D399" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Penyaring Deduplikasi Sliding Window O(1)</text>
  <text x="690" y="435" fill="#E2E8F0" font-family="sans-serif" font-size="11" text-anchor="middle">Paket Tercepat Tiba = Diterima Lolos Langsung</text>
  <text x="690" y="455" fill="#EF4444" font-family="sans-serif" font-size="11" text-anchor="middle">Paket Duplikat Terlambat = Dibuang Seketika (0 ms)</text>
  <text x="690" y="470" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Zero Allocations &amp; Lock-Free Execution</text>

  <!-- Arrow -->
  <line x1="690" y1="480" x2="690" y2="510" stroke="#10B981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3.3: Raw Forwarder -->
  <rect x="545" y="510" width="290" height="50" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="690" y="535" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">Penerus Datagram Socket Asli</text>
  <text x="690" y="550" fill="#94A3B8" font-family="sans-serif" font-size="10" text-anchor="middle">Relay Forwarding ke Game Port</text>

  <!-- Connect to Game Server -->
  <line x1="860" y1="535" x2="940" y2="535" stroke="#10B981" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="900" y="525" fill="#34D399" font-family="sans-serif" font-size="11" text-anchor="middle">&lt; 1 ms</text>

  <!-- Zone 4: Moonton Game Server -->
  <rect x="940" y="460" width="220" height="150" rx="12" fill="#1E1B4B" stroke="#6366F1" stroke-width="2"/>
  <text x="1050" y="500" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Server Game Moonton</text>
  <text x="1050" y="525" fill="#A5B4FC" font-family="sans-serif" font-size="12" text-anchor="middle">Pusat Data Eropa</text>
  <text x="1050" y="560" fill="#C7D2FE" font-family="sans-serif" font-size="11" text-anchor="middle">Menerima Paket Tunggal Bersih</text>
  <text x="1050" y="580" fill="#10B981" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Zero Packet Loss Terjamin</text>
</svg>
