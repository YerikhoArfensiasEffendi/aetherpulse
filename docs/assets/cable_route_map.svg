<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="35%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="620" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="618" rx="15" fill="none" stroke="#1F2937" stroke-width="2"/>

  <!-- Title & Legend -->
  <text x="50" y="55" fill="#F9FAFB" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Peta Topologi Rute Kabel Bawah Laut Jakarta Menuju Helsinki</text>
  <text x="50" y="82" fill="#9CA3AF" font-family="system-ui, -apple-system, sans-serif" font-size="14">Analisis jarak tempuh fisik serat optik dan akumulasi penundaan perambatan foton</text>

  <!-- Metric Badges Top Right -->
  <g transform="translate(760, 35)">
    <rect width="190" height="55" rx="8" fill="#1F2937" stroke="#374151"/>
    <text x="15" y="24" fill="#9CA3AF" font-family="sans-serif" font-size="11">Total Jarak Fisik</text>
    <text x="15" y="46" fill="#38BDF8" font-family="sans-serif" font-size="18" font-weight="700">15.900 km</text>
  </g>
  <g transform="translate(965, 35)">
    <rect width="185" height="55" rx="8" fill="#1F2937" stroke="#374151"/>
    <text x="15" y="24" fill="#9CA3AF" font-family="sans-serif" font-size="11">Batas Minimum RTT</text>
    <text x="15" y="46" fill="#34D399" font-family="sans-serif" font-size="18" font-weight="700">187,73 ms</text>
  </g>

  <!-- Undersea Cable Path Curved Line -->
  <path d="M 120 480 C 220 460, 260 410, 320 370 C 420 310, 520 350, 620 280 C 720 210, 800 240, 880 180 C 940 140, 1000 130, 1080 110" 
        fill="none" stroke="url(#cableGrad)" stroke-width="5" filter="url(#glow)"/>

  <!-- Station 1: Jakarta -->
  <g transform="translate(120, 480)">
    <circle r="14" fill="#0E7490" fill-opacity="0.4"/>
    <circle r="7" fill="#06B6D4"/>
    <rect x="-80" y="25" width="160" height="60" rx="8" fill="#111827" stroke="#0891B2" stroke-width="1.5"/>
    <text x="0" y="45" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Jakarta (ID)</text>
    <text x="0" y="62" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="11">Titik Awal Klien A53</text>
    <text x="0" y="76" text-anchor="middle" fill="#06B6D4" font-family="sans-serif" font-size="11">RTT 0 ms</text>
  </g>

  <!-- Segment 1: Jakarta to Singapore -->
  <text x="210" y="415" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">Kabel B2JS (1.150 km)</text>

  <!-- Station 2: Singapore -->
  <g transform="translate(320, 370)">
    <circle r="12" fill="#1D4ED8" fill-opacity="0.4"/>
    <circle r="6" fill="#3B82F6"/>
    <rect x="-75" y="25" width="150" height="60" rx="8" fill="#111827" stroke="#2563EB" stroke-width="1.5"/>
    <text x="0" y="45" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Singapura</text>
    <text x="0" y="62" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="11">Megahub Asia Equinix</text>
    <text x="0" y="76" text-anchor="middle" fill="#38BDF8" font-family="sans-serif" font-size="11">+11,2 ms RTT</text>
  </g>

  <!-- Segment 2: Singapore to Suez -->
  <text x="470" y="315" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">SEA-ME-WE 5 / AAE-1 (8.400 km)</text>

  <!-- Station 3: Suez Canal -->
  <g transform="translate(620, 280)">
    <circle r="12" fill="#6D28D9" fill-opacity="0.4"/>
    <circle r="6" fill="#8B5CF6"/>
    <rect x="-75" y="25" width="150" height="60" rx="8" fill="#111827" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="0" y="45" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Teluk Suez (Mesir)</text>
    <text x="0" y="62" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="11">Transit Darat 350 km</text>
    <text x="0" y="76" text-anchor="middle" fill="#A78BFA" font-family="sans-serif" font-size="11">+93,5 ms RTT</text>
  </g>

  <!-- Segment 3: Suez to Marseille/Frankfurt -->
  <text x="750" y="205" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">Laut Mediterania (4.150 km)</text>

  <!-- Station 4: Frankfurt -->
  <g transform="translate(880, 180)">
    <circle r="12" fill="#BE185D" fill-opacity="0.4"/>
    <circle r="6" fill="#EC4899"/>
    <rect x="-75" y="25" width="150" height="60" rx="8" fill="#111827" stroke="#DB2777" stroke-width="1.5"/>
    <text x="0" y="45" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Frankfurt (DE)</text>
    <text x="0" y="62" text-anchor="middle" fill="#94A3B8" font-family="sans-serif" font-size="11">DE-CIX Internet Node</text>
    <text x="0" y="76" text-anchor="middle" fill="#F472B6" font-family="sans-serif" font-size="11">+140,8 ms RTT</text>
  </g>

  <!-- Segment 4: Frankfurt to Helsinki -->
  <text x="980" y="130" fill="#64748B" font-family="sans-serif" font-size="11" text-anchor="middle">Laut Baltik (1.850 km)</text>

  <!-- Station 5: Helsinki -->
  <g transform="translate(1080, 110)">
    <circle r="16" fill="#059669" fill-opacity="0.4"/>
    <circle r="8" fill="#10B981"/>
    <rect x="-85" y="-85" width="170" height="65" rx="8" fill="#111827" stroke="#10B981" stroke-width="2"/>
    <text x="0" y="-63" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-size="13" font-weight="700">Helsinki (Finlandia)</text>
    <text x="0" y="-46" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="11">Relay Edge &amp; Game Server</text>
    <text x="0" y="-30" text-anchor="middle" fill="#A7F3D0" font-family="sans-serif" font-size="11" font-weight="700">Total Akumulasi: 187,7 ms</text>
  </g>

  <!-- Bottom Explanatory Bar -->
  <g transform="translate(50, 560)">
    <rect width="1100" height="40" rx="6" fill="#1E293B" stroke="#334155"/>
    <text x="20" y="25" fill="#94A3B8" font-family="sans-serif" font-size="12">
      Formula Fisika: RTT = 2 × (Jarak Fisik / Kecepatan Cahaya dalam Kaca Kaca Silika 204.190 km/s) + 20 Hop Router Perbatasan (32 ms).
    </text>
  </g>
</svg>
