version: '3.8'

services:
  bridgeplay-relay:
    build:
      context: ../server/go
      dockerfile: Dockerfile
    container_name: bridgeplay-edge-relay
    restart: always
    network_mode: "host"
    environment:
      - LISTEN_ADDR=0.0.0.0:8910
      - TARGET_ADDR=127.0.0.1:30000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
